name: Build and Sign ShakeLab

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout kode
      uses: actions/checkout@v4

    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependensi
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PyQt6 pyqtgraph openpyxl matplotlib opencv-contrib-python

    - name: Build EXE dengan PyInstaller
      run: |
        python -m PyInstaller --noconfirm --onedir --windowed `
          --name "ShakeLab" `
          --icon "logo.ico" `
          --add-data "logo.png;." `
          --add-data "logo.ico;." `
          --add-data "arrow_up.png;." `
          --add-data "arrow_down.png;." `
          --collect-all pyqtgraph `
          --collect-all cv2 `
          gui_app.py

    - name: Upload unsigned EXE ke Artifacts
      id: upload-unsigned
      uses: actions/upload-artifact@v4
      with:
        name: shakelab-unsigned-exe
        path: dist/ShakeLab/ShakeLab.exe

    - name: Tanda tangani EXE dengan SignPath
      uses: signpath/github-action-submit-signing-request@v1
      with:
        api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
        organization-id: '${{ secrets.SIGNPATH_ORG_ID }}'
        project-slug: 'ShakeLab'
        signing-policy-slug: 'ShakeLab'
        artifact-configuration-slug: 'initial-version'
        github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
        wait-for-completion: true
        output-artifact-directory: signed-output

    - name: Ganti EXE asli dengan EXE yang telah ditandatangani
      run: |
        Copy-Item -Path "signed-output\ShakeLab.exe" -Destination "dist\ShakeLab\ShakeLab.exe" -Force

    - name: Buat ZIP distribusi resmi
      run: |
        Compress-Archive -Path "dist\ShakeLab\*" -DestinationPath "ShakeLab-${{ github.ref_name }}-Windows.zip"

    - name: Buat GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: ShakeLab-${{ github.ref_name }}-Windows.zip
        name: ShakeLab ${{ github.ref_name }}
        body: |
          ## ShakeLab ${{ github.ref_name }}
          
          Aplikasi resmi telah ditandatangani secara digital via SignPath.
          
          ### Cara Menjalankan:
          1. Unduh file `ShakeLab-${{ github.ref_name }}-Windows.zip` di bawah.
          2. Ekstrak (Extract All) ke folder komputer Anda.
          3. Jalankan `ShakeLab.exe`.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
