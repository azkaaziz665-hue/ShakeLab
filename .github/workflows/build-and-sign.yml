name: Build and Release ShakeLab

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout kode
      uses: actions/checkout@v4

    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependensi
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PyQt6 pyqtgraph openpyxl matplotlib opencv-contrib-python

    - name: Build EXE dengan PyInstaller
      run: |
        python -m PyInstaller --noconfirm --onedir --windowed `
          --name "ShakeLab" `
          --icon "logo.ico" `
          --add-data "logo.png;." `
          --add-data "logo.ico;." `
          --add-data "arrow_up.png;." `
          --add-data "arrow_down.png;." `
          --collect-all pyqtgraph `
          --collect-all cv2 `
          gui_app.py

    - name: Buat ZIP distribusi aplikasi
      run: |
        Compress-Archive -Path "dist\ShakeLab\*" -DestinationPath "ShakeLab-${{ github.ref_name }}-Windows.zip"

    - name: Buat GitHub Release Otomatis
      uses: softprops/action-gh-release@v2
      with:
        files: ShakeLab-${{ github.ref_name }}-Windows.zip
        name: ShakeLab ${{ github.ref_name }}
        body: |
          ## 🏢 ShakeLab ${{ github.ref_name }}
          Aplikasi Analisis Getaran Bangunan Miniatur untuk Uji Gempa.
          
          ### 📥 Cara Menjalankan Aplikasi:
          1. Unduh file **`ShakeLab-${{ github.ref_name }}-Windows.zip`** di bawah.
          2. Klik kanan file `.zip` yang telah diunduh, lalu pilih **Extract All (Ekstrak Semua)**.
          3. Buka folder hasil ekstrak, lalu klik ganda **`ShakeLab.exe`**.
          
          ---
          > 💡 **Jika muncul jendela biru "Windows protected your PC":**
          > Klik **More info (Info selengkapnya)** ➔ lalu klik tombol **Run anyway (Tetap jalankan)**.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}